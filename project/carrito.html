<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - INFOTEL PERÚ</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Header -->
  <header id="header"></header>

  <!-- Main Content -->
  <main class="container">
    <section class="cart-section">
      <h1>Carrito de Compras</h1>
      
      <div id="cart-empty" class="cart-empty hidden">
        <i class="fas fa-shopping-cart"></i>
        <p>Tu carrito está vacío</p>
        <a href="index.html" class="btn-primary">Continuar Comprando</a>
      </div>
      
      <div id="cart-content" class="cart-content">
        <div class="cart-items">
          <div class="cart-header">
            <span class="col-product">Producto</span>
            <span class="col-price">Precio</span>
            <span class="col-quantity">Cantidad</span>
            <span class="col-total">Total</span>
            <span class="col-remove"></span>
          </div>
          
          <div id="cart-items-container">
            <!-- Cart items will be added dynamically -->
          </div>
        </div>
        
        <div class="cart-summary">
          <h2>Resumen</h2>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="cart-subtotal">S/. 0.00</span>
          </div>
          <div class="summary-row">
            <span>Envío</span>
            <span id="cart-shipping">S/. 15.00</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="cart-total">S/. 0.00</span>
          </div>
          <button id="checkout-button" class="btn-primary full-width">Ir a Pagar</button>
          <a href="index.html" class="btn-secondary full-width">Continuar Comprando</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="footer"></footer>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script type="module" src="js/cart.js"></script>
</body>
</html>
