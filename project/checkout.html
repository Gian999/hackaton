<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - INFOTEL PERÚ</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/checkout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Header -->
  <header id="header"></header>

  <!-- Main Content -->
  <main class="container">
    <section class="checkout-section">
      <h1>Finalizar Compra</h1>
      
      <div class="checkout-container">
        <div class="checkout-form">
          <h2>Datos de Envío</h2>
          <form id="checkout-form">
            <div class="form-group">
              <label for="nombre">Nombre completo</label>
              <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group">
              <label for="email">Correo electrónico</label>
              <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
              <label for="telefono">Teléfono</label>
              <input type="tel" id="telefono" name="telefono" required>
            </div>
            
            <div class="form-group">
              <label for="direccion">Dirección</label>
              <input type="text" id="direccion" name="direccion" required>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad" required>
              </div>
              
              <div class="form-group">
                <label for="codigo_postal">Código Postal</label>
                <input type="text" id="codigo_postal" name="codigo_postal" required>
              </div>
            </div>
            
            <h2>Método de Pago</h2>
            <div class="payment-methods">
              <div class="payment-method">
                <input type="radio" id="tarjeta" name="metodo_pago" value="tarjeta" checked>
                <label for="tarjeta">
                  <i class="fas fa-credit-card"></i>
                  Tarjeta de Crédito/Débito
                </label>
              </div>
              
              <div class="payment-method">
                <input type="radio" id="transferencia" name="metodo_pago" value="transferencia">
                <label for="transferencia">
                  <i class="fas fa-university"></i>
                  Transferencia Bancaria
                </label>
              </div>
              
              <div class="payment-method">
                <input type="radio" id="efectivo" name="metodo_pago" value="efectivo">
                <label for="efectivo">
                  <i class="fas fa-money-bill-wave"></i>
                  Pago en Efectivo
                </label>
              </div>
            </div>
            
            <div id="tarjeta-details" class="payment-details">
              <div class="form-group">
                <label for="numero_tarjeta">Número de tarjeta</label>
                <input type="text" id="numero_tarjeta" name="numero_tarjeta" placeholder="1234 5678 9012 3456">
              </div>
              
              <div class="form-row">
                <div class="form-group">
                  <label for="fecha_vencimiento">Fecha de vencimiento</label>
                  <input type="text" id="fecha_vencimiento" name="fecha_vencimiento" placeholder="MM/AA">
                </div>
                
                <div class="form-group">
                  <label for="cvv">CVV</label>
                  <input type="text" id="cvv" name="cvv" placeholder="123">
                </div>
              </div>
            </div>
            
            <button type="submit" class="btn-primary full-width">Confirmar Pedido</button>
          </form>
        </div>
        
        <div class="order-summary">
          <h2>Resumen del Pedido</h2>
          <div id="checkout-items">
            <!-- Checkout items will be added dynamically -->
          </div>
          
          <div class="summary-totals">
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="checkout-subtotal">S/. 0.00</span>
            </div>
            <div class="summary-row">
              <span>Envío</span>
              <span id="checkout-shipping">S/. 15.00</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="checkout-total">S/. 0.00</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Order Confirmation Modal -->
  <div id="confirmation-modal" class="modal">
    <div class="modal-content">
      <div class="confirmation-message">
        <i class="fas fa-check-circle"></i>
        <h2>¡Pedido Confirmado!</h2>
        <p>Tu pedido ha sido recibido y está siendo procesado.</p>
        <p>Hemos enviado un correo de confirmación a <span id="confirmation-email"></span></p>
        <p class="order-number">Número de pedido: <span id="order-number"></span></p>
        <a href="index.html" class="btn-primary">Volver a la Tienda</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer id="footer"></footer>

  <!-- Scripts -->
  <script type="module" src="js/checkout.js"></script>
</body>
</html>
